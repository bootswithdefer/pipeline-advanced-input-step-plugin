---
default_install_hook_types:
  - pre-commit
  - commit-msg
repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8 # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-json
      - id: check-yaml
        args:
          - --allow-multiple-documents
      - id: pretty-format-json
        args: ["--autofix", "--no-sort-keys"]
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-symlinks
      - id: check-vcs-permalinks
  - repo: https://github.com/bootswithdefer/prettier-plugin-jenkinsfile
    rev: 6d772fa8064ceb94bff4a7ddf86a2cd747e97a10 # frozen: v0.3.0
    hooks:
      - id: jenkinsfile-fmt
  - repo: https://github.com/google/yamlfmt
    rev: 21ca5323a9c87ee37a434e0ca908efc0a89daa07 # frozen: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df # frozen: 0.39.0
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c # frozen: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        args: [--line-length=160]
